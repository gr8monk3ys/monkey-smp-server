name: CI

# What runs when (docs/MAINTAINING.md, "Tests"): every push to a PR runs tools/checks.py, the same checks a
# maintainer runs (python tools/checks.py) and tools/local_ci.py posts when Actions can't run. The boot jobs cost
# far more (Windows minutes count double on this private repo), so `checks.py --boots` decides which a run needs:
# none for a draft PR, the ones its change can break for a ready one, all of them for a release tag, a manual
# run or a PR labelled `boot`.
on:
  push:
    branches: [main]
  pull_request:
    # not `labeled`: any label (triage ones too) would start a run and cancel the one going. The `boot` label
    # takes effect from the next push; to boot now, run the workflow by hand on the branch.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_call:
    inputs:
      macos:
        description: Also boot the server on macOS (macOS minutes cost 10x)
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      macos:
        description: Also boot the server on macOS (macOS minutes cost 10x)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tools:
    name: Checks (lint, tests, packs, sh, Pester), build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      linux: ${{ steps.plan.outputs.linux }}
      windows: ${{ steps.plan.outputs.windows }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the boot plan diffs the PR against where it left its base
      - uses: actions/setup-python@v7
        with:
          # 3.11 is the oldest Python the tools run on (pyproject.toml; Debian 12 on the VPS); the last one listed
          # is the default `python`.
          python-version: |
            3.11
            3.12
      - run: python -m pip install pytest ruff && python3.11 -m pip install pytest
      - name: Install Pester
        shell: pwsh
        run: Install-Module Pester -MinimumVersion 5.5 -Scope CurrentUser -Force -SkipPublisherCheck
      # The site's check (site/: lint, typecheck, build) needs bun; the version the lockfile was made with.
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.3
      - name: tools/checks.py (ruff, pytest, validate, datapacks, sh, pester, site)
        run: python tools/checks.py --strict
      - name: Unit tests on Python 3.11
        run: python3.11 -m pytest -q -p no:cacheprovider
      - name: Build release files
        run: python tools/build.py
      - name: Upload release files
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
      - name: Which boot jobs this run needs
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          DRAFT: ${{ github.event.pull_request.draft }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}   # JSON: a label name can hold spaces
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python tools/checks.py --boots | tee -a "$GITHUB_OUTPUT"

  smoke:
    name: Boot the packaged server (Windows)
    needs: tools
    if: needs.tools.outputs.windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Lint PowerShell (PSScriptAnalyzer)
        shell: powershell
        run: |
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -SkipPublisherCheck
          $files = 'package/monkey/monkey.ps1', 'package/monkey/Monkey.psm1', 'tests/smoke.ps1', 'tests/Monkey.Tests.ps1',
                   'player/installer/install-client.ps1', 'player/installer/PlayerInstall.psm1', 'tests/Player.Tests.ps1'
          $issues = $files | ForEach-Object { Invoke-ScriptAnalyzer -Path $_ -Settings ./PSScriptAnalyzerSettings.psd1 }
          $issues | Format-Table -AutoSize | Out-String -Width 200 | Write-Host
          if ($issues) { exit 1 }

      - name: Unit tests (Pester)
        shell: powershell
        run: |
          Install-Module Pester -MinimumVersion 5.5 -Scope CurrentUser -Force -SkipPublisherCheck
          Import-Module Pester -MinimumVersion 5.5
          $r = Invoke-Pester -Path tests/Monkey.Tests.ps1, tests/Player.Tests.ps1 -Output Detailed -PassThru
          if ($r.FailedCount) { exit 1 }

      - name: Download the release files built by the tools job
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist

      - name: Unzip like a user would
        shell: powershell
        run: Expand-Archive -Path (Get-Item dist/MonkeySMP-Server-*.zip) -DestinationPath "$env:RUNNER_TEMP\monkey"

      - name: Prepare a hosting bundle (installs first, never starts the server)
        shell: powershell
        run: |
          & "$env:RUNNER_TEMP\monkey\MonkeySMP-Server\monkey\monkey.ps1" export-host -AcceptEula -NonInteractive -NoOwner
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Upload the hosting bundle for the Linux/Docker test
        uses: actions/upload-artifact@v7
        with:
          name: hosting-bundle
          path: ${{ runner.temp }}/monkey/MonkeySMP-Server/exports/*.zip
          retention-days: 1
          compression-level: 0

      - name: Install, boot, check mods/plugins and datapacks, stop
        shell: powershell
        run: ./tests/smoke.ps1 -Root "$env:RUNNER_TEMP\monkey\MonkeySMP-Server" -MemoryGB 4

      - name: Upload server logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: server-logs
          path: |
            ${{ runner.temp }}/monkey/MonkeySMP-Server/server/logs/
            ${{ runner.temp }}/monkey/MonkeySMP-Server/smoke-console.log*
          if-no-files-found: ignore

  hosting:
    name: Boot the hosting bundle with Docker (Linux)
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: hosting-bundle
          path: bundle
      - name: docker compose up, wait for Done, stop
        env:
          MEMORY_GB: "4"
          TIMEOUT_MINUTES: "30"
        run: bash tests/hosting-smoke.sh bundle/*.zip "$RUNNER_TEMP/hosting"
      - name: Upload the container log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hosting-log
          path: ${{ runner.temp }}/hosting/*/compose.log
          if-no-files-found: ignore

  native:
    name: Boot the packaged server (${{ matrix.os }})
    needs: tools
    if: needs.tools.outputs.linux == 'true'
    strategy:
      fail-fast: false
      matrix:
        # macOS minutes cost 10x on this private repo: only on manual runs and for releases
        # (the macos input is true there and absent on pushes and pull requests).
        os: ${{ fromJSON(inputs.macos && '["Linux", "macOS"]' || '["Linux"]') }}
    runs-on: ${{ matrix.os == 'macOS' && 'macos-latest' || 'ubuntu-latest' }}
    timeout-minutes: 45
    env:
      # Exercise the bootstrap's pinned portable PowerShell, not the runner's own pwsh.
      MONKEY_IGNORE_SYSTEM_PWSH: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist

      - name: Unzip like a user would
        run: |
          unzip -q dist/MonkeySMP-Server-*.zip -d "$RUNNER_TEMP/monkey"
          echo "ROOT=$RUNNER_TEMP/monkey/MonkeySMP-Server" >> "$GITHUB_ENV"

      - name: Launchers kept their executable bit
        working-directory: ${{ env.ROOT }}
        run: |
          for f in start.sh stop.sh backup.sh add-player.sh prepare-for-hosting.sh 'Start Server.command' monkey/monkey.sh; do
            [ -x "$f" ] || { echo "$f is missing or not executable"; exit 1; }
          done

      - name: Install through the bootstrap (downloads the pinned PowerShell, then Java and the mods)
        working-directory: ${{ env.ROOT }}
        run: |
          ./monkey/monkey.sh install -AcceptEula -NonInteractive -NoOwner
          find . -type f -name pwsh -perm -u+x | grep -q . || { echo "the bootstrap did not download PowerShell"; exit 1; }

      - name: Unit tests (Pester)
        if: matrix.os == 'macOS'
        shell: pwsh
        run: |
          Install-Module Pester -MinimumVersion 5.5 -Scope CurrentUser -Force -SkipPublisherCheck
          Import-Module Pester -MinimumVersion 5.5
          $r = Invoke-Pester -Path tests/Monkey.Tests.ps1 -Output Detailed -PassThru
          if ($r.FailedCount) { exit 1 }

      - name: Boot, check mods and datapacks, stop
        shell: pwsh
        run: ./tests/smoke.ps1 -Root $env:ROOT -MemoryGB 4

      - name: Upload server logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: server-logs-${{ matrix.os }}
          path: |
            ${{ env.ROOT }}/server/logs/
            ${{ env.ROOT }}/server/crash-reports/
            ${{ env.ROOT }}/smoke-console.log*
          if-no-files-found: ignore

  docker:
    name: Boot the server with Docker (Linux)
    needs: tools
    if: needs.tools.outputs.linux == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist
      - name: Unzip, EULA in docker/.env, docker compose up, wait for Done, rcon, stop
        env:
          MEMORY_GB: "4"
          TIMEOUT_MINUTES: "30"
        run: bash tests/docker-smoke.sh dist/MonkeySMP-Server-*.zip "$RUNNER_TEMP/docker"
      - name: Upload the container and server logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: docker-logs
          path: |
            ${{ runner.temp }}/docker/MonkeySMP-Server/compose.log
            ${{ runner.temp }}/docker/MonkeySMP-Server/server/logs/
            ${{ runner.temp }}/docker/MonkeySMP-Server/server/crash-reports/
          if-no-files-found: ignore
