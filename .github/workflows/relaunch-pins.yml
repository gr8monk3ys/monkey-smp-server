name: Relaunch pins

# Pins the relaunch's Paper build and plugins (tools/relaunch.py) on a runner with internet, because the pins need
# Modrinth, PaperMC and GeyserMC. It only reads: the report and the new manifest.json are printed to the log for a
# maintainer to check and commit. Delete this workflow once the relaunch branch is merged.
on:
  push:
    branches: [relaunch/platform]
    paths: [tools/relaunch.py, tools/entries.py, .github/workflows/relaunch-pins.yml]
  workflow_dispatch:
    inputs:
      mc:
        description: Minecraft version to pin
        default: "26.3"

permissions:
  contents: read

jobs:
  pin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Pin Paper and the plugin stack
        shell: bash
        run: python tools/relaunch.py --mc "${{ inputs.mc || '26.3' }}" --skip-missing --report pins.md
      - name: Look up slugs and fallbacks
        shell: bash
        run: |
          cd tools && python - <<'PY'
          import json, urllib.parse
          from upstream import LiveHttp, MODRINTH
          http = LiveHttp()
          for q in ("lpc chat", "economyshopgui", "donut auction house", "theneweconomy", "coinsengine",
                    "tebex", "ultracosmetics", "deluxetags", "essentialsx"):
              for label, facets in (("26.3", [["project_type:plugin"], ["versions:26.3"]]),
                                    ("any", [["project_type:plugin"]])):
                  hits = http.get_json(f"{MODRINTH}/search?query={urllib.parse.quote(q)}&limit=4&index=relevance"
                                       "&facets=" + urllib.parse.quote(json.dumps(facets)))
                  print(f"search {q!r} [{label}]", [(h["slug"], h["downloads"], h.get("versions", [])[-2:])
                                                    for h in hits["hits"]])
          PY
      - name: Show the manifest
        run: cat package/monkey/manifest.json
