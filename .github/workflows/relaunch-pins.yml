name: Relaunch pins

# Pins the relaunch's Paper build and plugins (tools/relaunch.py) on a runner with internet, because the pins need
# Modrinth and PaperMC. It only reads: the report and the new manifest.json are printed to the log for a
# maintainer to check and commit. Delete this workflow once the relaunch branch is merged.
on:
  push:
    branches: [relaunch/platform]
    paths: [tools/relaunch.py, tools/entries.py, .github/workflows/relaunch-pins.yml]
  workflow_dispatch:
    inputs:
      mc:
        description: Minecraft version to pin
        default: "26.3"

permissions:
  contents: read

jobs:
  pin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Pin Paper and the plugin stack
        shell: bash
        run: python tools/relaunch.py --mc "${{ inputs.mc || '26.3' }}" --skip-missing --report pins.md
      - name: Look up what couldn't be pinned
        shell: bash
        run: |
          cd tools && python - <<'PY'
          import json, urllib.parse
          from upstream import LiveHttp, MODRINTH
          http = LiveHttp()
          for q in ("floodgate", "essentialsx", "huskclaims", "essentialsx chat", "essentialsx spawn"):
              hits = http.get_json(f"{MODRINTH}/search?query={urllib.parse.quote(q)}&limit=4"
                                   "&facets=" + urllib.parse.quote(json.dumps([["project_type:plugin"]])))
              print("search", q, [(h["slug"], h["project_id"]) for h in hits["hits"]])
          for slug in ("floodgate", "essentialsx", "essentialsx-spawn"):
              vs = http.get_json(f"{MODRINTH}/project/{slug}/version")[:4]
              for v in vs:
                  print(slug, v["version_number"], v["version_type"], v["loaders"], v["game_versions"][-4:],
                        v["date_published"][:10])
          PY
      - name: Show the manifest
        run: cat package/monkey/manifest.json
