name: Relaunch pins

# Pins the relaunch's Paper build and plugins (tools/relaunch.py) on a runner with internet, because the pins need
# Modrinth and PaperMC. It only reads: the report and the new manifest.json are printed to the log for a
# maintainer to check and commit. Delete this workflow once the relaunch branch is merged.
on:
  push:
    branches: [relaunch/platform]
    paths: [tools/relaunch.py, tools/entries.py, .github/workflows/relaunch-pins.yml]
  workflow_dispatch:
    inputs:
      mc:
        description: Minecraft version to pin
        default: "26.3"

permissions:
  contents: read

jobs:
  pin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Pin Paper and the plugin stack
        shell: bash
        run: python tools/relaunch.py --mc "${{ inputs.mc || '26.3' }}" --skip-missing --report pins.md
      - name: Look up what couldn't be pinned
        shell: bash
        run: |
          cd tools && python - <<'PY'
          import json, urllib.parse
          from upstream import LiveHttp, MODRINTH
          http = LiveHttp()
          for q in ("griefprevention", "claims", "land claim protection"):
              hits = http.get_json(f"{MODRINTH}/search?query={urllib.parse.quote(q)}&limit=6&index=downloads"
                                   "&facets=" + urllib.parse.quote(json.dumps([["project_type:plugin"], ["versions:26.3"]])))
              print("search", q, [(h["slug"], h["downloads"]) for h in hits["hits"]])
          for url in ("https://download.geysermc.org/v2/projects/floodgate/versions/latest/builds/latest",
                      "https://hangar.papermc.io/api/v1/projects/HuskClaims/versions?limit=2",
                      "https://hangar.papermc.io/api/v1/projects/EssentialsX/versions?limit=2"):
              try:
                  print(url, json.dumps(http.get_json(url))[:900])
              except Exception as err:
                  print(url, "failed:", err)
          PY
      - name: Show the manifest
        run: cat package/monkey/manifest.json
