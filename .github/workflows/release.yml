name: Release

# Push a tag that matches package/realms/manifest.json "version", e.g.  git tag v1.0.0 && git push --tags
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build (fails if the tag doesn't match the manifest version)
        run: python tools/build.py
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## \\[?"v"\\]?" {on=1; next} /^## / && on {exit} on' CHANGELOG.md > notes.md
          cat >> notes.md <<'EOF'

          ### Downloads
          - **TheRealms-Server-*.zip** - for whoever hosts. Unzip, double-click `Start Server.bat`, read `READ ME FIRST.txt`.
          - **TheRealms-Client-*.mrpack** - for players. Import into Prism Launcher or the Modrinth App.
          EOF
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "The Realms $GITHUB_REF_NAME" --notes-file notes.md --verify-tag
