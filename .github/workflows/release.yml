name: Release

# Push a tag that matches package/realms/manifest.json "version", e.g.  git tag v1.0.0 && git push --tags
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # The notes are the version's CHANGELOG.md section plus what each download is for; the build fails
      # if the tag doesn't match the manifest version or the CHANGELOG has no section for it.
      - name: Build, and the release notes from CHANGELOG.md
        run: python tools/build.py --notes notes.md
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Monkey SMP $GITHUB_REF_NAME" --notes-file notes.md --verify-tag

  # Releasing step 5 (docs/MAINTAINING.md): the client pack on Modrinth, so players who install from there get
  # what the server expects. Uploads nothing when the release left the pack alone. Needs the repo secret
  # MODRINTH_TOKEN (docs/MODRINTH.md); without it the job only warns, and the weekly update check keeps asking.
  modrinth:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Publish the client pack on Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          if [ -z "$MODRINTH_TOKEN" ]; then
            echo "::warning::No MODRINTH_TOKEN secret, so Modrinth still has the previous pack: run python tools/modrinth.py from this tag (docs/MODRINTH.md)"
            exit 0
          fi
          python tools/modrinth.py
