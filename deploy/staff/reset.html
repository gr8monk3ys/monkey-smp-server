<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#1f6142">
  <title>New password: Monkey SMP staff</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="staff.css">
  <link rel="stylesheet" href="auth.css">
  <script src="auth.js" defer></script>
</head>
<body data-page="reset">
  <header class="top">
    <p class="brand">Monkey <b>SMP</b> <span>staff</span></p>
  </header>

  <main class="gate">
    <section class="card">
      <h1>Choose a password</h1>
      <p class="fine">At least 12 characters, and not your login's name. A long phrase is easiest to remember. Every
        place you are logged in is logged out.</p>
      <p class="attention" id="error" role="alert" hidden></p>
      <p class="note" id="note" role="status" hidden></p>
      <form id="reset-form" method="post" action="/auth/reset" novalidate>
        <div class="field">
          <label for="password">New password</label>
          <input id="password" name="new-password" type="password" autocomplete="new-password" minlength="12" maxlength="256" required>
        </div>
        <div class="field">
          <label for="again">The same again</label>
          <input id="again" name="again" type="password" autocomplete="new-password" minlength="12" maxlength="256" required>
        </div>
        <div class="actions">
          <button class="btn primary" id="reset" type="submit">Set the password</button>
        </div>
      </form>
      <p id="done" hidden><a class="btn primary" href="/login">Log in</a></p>
    </section>
  </main>

  <noscript><p class="attention">This page needs JavaScript turned on.</p></noscript>
</body>
</html>
