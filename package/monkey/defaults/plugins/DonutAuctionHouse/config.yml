# ─────────────────────────────────────────────────────────────────────────────
#  Monkey SMP: the auction house (/ah), DonutAuctionHouse.
#  Why each value is what it is: docs/relaunch/economy.md ("The auction house").
#  Based on the plugin's own default config.yml (github.com/MeherBenSalem/DonutAuction, Apache-2.0).
#
#  New settings are added to this file when the server starts; our values are kept.
#  Reload with /ah reload (storage and sync settings need a restart).
#  All text players see lives in messages.yml (MiniMessage, &-codes and &#RRGGBB hex).
# ─────────────────────────────────────────────────────────────────────────────

storage:
  # One server: SQLite. The season reset deletes this file (docs/relaunch/economy.md, "Each season").
  type: SQLITE
  sqlite:
    file: auctions.db
  mysql:
    host: localhost
    port: 3306
    database: donut_auction_house
    username: root
    password: password
    parameters: useSSL=false&characterEncoding=utf8

auction:
  listing-duration-hours: 48
  # Up to 7 lengths offered in the sell menu, in hours. No week-long listings: stale cheap stock sits on page 1.
  durations: [12, 24, 48, 72]
  max-duration-hours: 72
  browse-page-size: 45
  expired-scan-interval-seconds: 60
  # Price limits for a whole listing. The floor stops $1 "gifts" that move money between alts.
  min-price: 10
  max-price: 1.0E9
  # Per single item. Floors near the server shop's sell price, so the auction house can't be used to launder
  # money below what /sell pays.
  price-limits:
    DIAMOND: {min: 100}
    DIAMOND_BLOCK: {min: 900}
    NETHERITE_SCRAP: {min: 600}
    ANCIENT_DEBRIS: {min: 500}
  allow-shorthand-prices: true
  # Seconds between two listings: slows bot relisting without bothering a person.
  cooldown-seconds: 3

bidding:
  enabled: true
  # Empty: anyone may start an auction.
  permission: ''
  min-increment-percent: 5
  min-increment: 1
  anti-snipe-seconds: 30

economy:
  # The main money sink. 5% of every sale leaves the economy (deposit-to is empty).
  sales-tax:
    enabled: true
    percent: 5.0
    # No tiers. Paid ranks are cosmetic only, so nobody pays less tax (Mojang's rules, the relaunch plan).
    permissions: {}
    deposit-to: ''
  # 1% to list, kept even if the item doesn't sell, capped at $2,500: makes relisting spam cost something.
  listing-fee:
    enabled: true
    flat: 0
    percent: 1.0
    max: 2500
    exempt-permission: donutauction.fee.exempt

auction-lore:
  mode: APPEND
  separator: true

price-display:
  locale: en-US
  compact:
    enabled: true
    precision: 1
    thousand-suffix: k
    million-suffix: M
    template: '$%amount%%suffix%'

history:
  # Pacific, where the players are. Kept the whole season: dupe hunts read it.
  timezone: America/Los_Angeles
  date-format: 'yyyy-MM-dd HH:mm z'
  retention-days: 0

market:
  insight: true
  window-days: 7

notifications:
  sold: true
  titles: true
  outbid: true
  won: true
  expired: true
  bids-on-my-items: true
  join-summary: true
  join-delay-seconds: 3

collection:
  deliver-on-join: true

broadcast:
  new-listings: false
  min-price: 10000
  cooldown-seconds: 10

restrictions:
  disabled-worlds: []
  # Creative and spectator items never reach the market.
  blocked-gamemodes: [CREATIVE, SPECTATOR]

blacklist:
  materials: [BEDROCK, BARRIER, COMMAND_BLOCK, CHAIN_COMMAND_BLOCK, REPEATING_COMMAND_BLOCK, STRUCTURE_BLOCK, JIGSAW,
              DEBUG_STICK, LIGHT, STRUCTURE_VOID, SPAWNER, TRIAL_SPAWNER, KNOWLEDGE_BOOK]
  name-contains: []
  # Founder and season cosmetics are earned, not traded. The wardrobe workstream marks them; add its lore line
  # or data key here once it exists.
  lore-contains: []
  custom-model-data: []
  pdc-keys: []

# Five listings each, the same for everyone. The limit and slot permissions are never given to a paid rank.
auction-limits:
  enabled: true
  default-limit: 5
  permissions:
    donutauction.limit.unlimited: -1

auction-slots:
  enabled: true
  permissions: {}

fast-buy:
  enabled: true
  default-state: false
  require-permission: true

fast-sell:
  enabled: true
  default-state: false
  require-permission: true

shulker-support:
  enabled: true
  preview-contents: true

sounds:
  enabled: true
  click: 'minecraft:ui.button.click:0.4:1.2'
  success: 'minecraft:entity.experience_orb.pickup:0.6:1.3'
  error: 'minecraft:entity.villager.no:0.6:1.0'
  purchase: 'minecraft:entity.player.levelup:0.5:1.6'
  sold: 'minecraft:block.note_block.pling:0.8:1.4'
  outbid: 'minecraft:block.note_block.bass:0.8:0.8'
  won: 'minecraft:ui.toast.challenge_complete:0.6:1.2'

# Off until a staff channel's webhook exists; a public trade feed would also help clips.
discord:
  enabled: false
  webhook-url: ''
  username: 'Auction House'
  avatar-url: ''
  events: [LISTED, SOLD, WON]
  min-price: 0
  head-url: 'https://mc-heads.net/avatar/{uuid}/64'
  item-icon-url: ''
  footer: 'Monkey SMP'

# A line per trade in plugins/DonutAuctionHouse/logs/transactions-YYYY-MM-DD.log (UTC). Needed for dupe hunts.
transaction-log:
  enabled: true

placeholderapi:
  enabled: true

debug:
  pending-sales: false

metrics:
  enabled: true

update-checker:
  enabled: true
  notify-console: true
  notify-admins: true
  check-interval-hours: 12

sync:
  poll-interval-seconds: 3
  redis:
    enabled: false
    host: localhost
    port: 6379
    password: ""
    channel: donutauction:listings

messages:
  prefix: '&6&lAuction House &8» '
  price-below-min: '&cMinimum auction price is &6%min_price%&c.'
