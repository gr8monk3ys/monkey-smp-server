# Generated by tools/store.py: edit its tables, then run it. Don't edit this file.
# Only the settings Monkey SMP changes. UltraCosmetics fills in every other key from its own defaults.
Categories-Enabled:
  Pets: true
  Particle-Effects: true
  Death-Effects: true
  Projectile-Effects: true
  Gadgets: false
  Mounts: false
  Morphs: false
  Hats: false
  Suits: false
  Emotes: false
# No random boxes: keys bought with in-game money are a lottery, and many players are children.
TreasureChests:
  Enabled: false
# Cosmetics are unlocked by permission only (the store, ranks, the pass), never bought in the menu.
No-Permission:
  Show-In-Lore: true
  Allow-Purchase: false
# Armor bonuses would make a cosmetic a gameplay item. The categories that use them are off as well.
Attribute-Bonus:
  EMOTES:
    GENERIC_ARMOR: 0
  HATS:
    GENERIC_ARMOR: 0
# Pets must not block shots, body-block in fights, mask footsteps or litter the ground.
Pets-Have-Collision: false
Pets-Are-Silent: true
Pets-Drop-Items: false
Pets-Can-Ride: false
Pets-Are-Babies: true
Airlift-Pets: false
Pets-Rename:
  Enabled: false
Cosmetics-Affect-Entities: false
# No menu item in the hotbar: a PvP server's hotbar is for fighting. Players open it with /uc menu.
Menu-Item:
  Enabled: false
# Off: every one that no rank, one-off, pass tier or holiday gives (big pets that block the view, and mobs that look like a raid); Illusioner also because Bedrock players can't see it properly.
Pets:
  IronGolem:
    Enabled: false
  Wither:
    Enabled: false
  CaveSpider:
    Enabled: false
  Guardian:
    Enabled: false
  Warden:
    Enabled: false
  PiglinBrute:
    Enabled: false
  ZombifiedPiglin:
    Enabled: false
  WanderingTrader:
    Enabled: false
  Pillager:
    Enabled: false
  Ravager:
    Enabled: false
  Drowned:
    Enabled: false
  Illusioner:
    Enabled: false
  SkeletonHorse:
    Enabled: false
  ZombieHorse:
    Enabled: false
  ElderGuardian:
    Enabled: false
  ZombieVillager:
    Enabled: false
# Off: SuperHero and SuperVillain (cape-shaped, Mojang's cape rule), and every one that no rank, one-off, pass tier or holiday gives.
Particle-Effects:
  SuperHero:
    Enabled: false
  SuperVillain:
    Enabled: false
# Off: every one that no rank, one-off, pass tier or holiday gives.
Death-Effects:
# Off: every one that no rank, one-off, pass tier or holiday gives; MagicCrit also because Bedrock players can't see it properly.
Projectile-Effects:
  MagicCrit:
    Enabled: false
  Explosion:
    Enabled: false
