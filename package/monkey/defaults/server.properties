#Monkey SMP - first-run defaults, filled in once by the installer.
#After that this file is yours to edit (stop the server first).
#The branding workstream may replace this line; it is only the first-run text.
motd=\u00a76\u00a7lMonkey SMP \u00a77- \u00a7fSeason 1 \u00a78| \u00a7aEconomy \u00a78| \u00a7cLifesteal
level-name={{LEVEL_NAME}}
level-seed={{SEED}}
online-mode=true
#A public server: anyone can join on Java or Bedrock (Geyser and Floodgate).
white-list=false
enforce-whitelist=false
#Every player accepts the short rules (codeofconduct/en_us.txt) before joining, and again when they change.
enable-code-of-conduct=true
pvp=true
difficulty=normal
gamemode=survival
max-players=60
view-distance=8
simulation-distance=5
#Spawn and safe zones are WorldGuard regions; vanilla spawn protection would also lock out staff without op.
spawn-protection=0
allow-flight=false
server-port=25565
enable-command-block=false
sync-chunk-writes=false
#Bedrock players join through Floodgate and can't sign chat, so the server can't require signed chat.
enforce-secure-profile=false
#Paper stops a server stuck for a minute (Docker then restarts it); there is no modded world generation to wait for.
max-tick-time=60000
enable-rcon=true
rcon.port=25575
rcon.password={{RCON_PASSWORD}}
broadcast-rcon-to-ops=false
