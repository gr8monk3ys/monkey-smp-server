#Monkey SMP: a faction (an Open Parties and Claims party) holds at most 4 players (rule 29), and each player
#claims at most 2 x 2 chunks, so a faction's territory is 2 x 2 chunks per member (rule 35).
#Only these options are set here; the mod fills in every other one with its default on first start.
[serverConfig]
	[serverConfig.claims]
		#The maximum number of chunks that a player can claim. Additional claims can be configured in the player config.
		#This value can be overridden with a player permission.
		maxPlayerClaims = 4
		[serverConfig.claims.protection]
			#Monkey SMP: the universal_shops entry is dormant while shops are shelved (26 October 2026): Universal Shops
			#isn't in the pack, and Open Parties and Claims starts clean with an id for a block that isn't there.
			#With shops back, anyone may open a trade shop in someone's claim, with an empty hand ("hand$"), so shops
			#in claims can sell to everyone while their stock chests stay protected. An item in the hand would let
			#the click place blocks inside the claim. "minecraft:crafting_table" is the mod's own default.
			#Blocks to partially exclude from chunk protection. Supports block tags.
			forcedBlockProtectionExceptionList = ["minecraft:crafting_table", "hand$universal_shops:trade_block"]
			#Monkey SMP: anyone may right-click an Easy NPC (the Guide and the Town Crier at spawn) in any claim,
			#spawn's server claim included, with an empty hand ("hand$"). Without it the spawn claim answers players
			#with "You are not allowed to interact with this entity in this chunk". An item in the hand would also let
			#it be used on the NPC (a name tag, a lead); hitting them stays protected. The ids are named, not
			#"easy_npc:*": the mod promises ids and tags, not wildcards. "minecraft:minecart" is the mod's own default.
			#Entities to partially exclude from chunk protection. Supports entity type tags.
			forcedEntityProtectionExceptionList = ["minecraft:minecart", "hand$easy_npc:humanoid", "hand$easy_npc:humanoid_slim"]
	[serverConfig.parties]
		#The maximum number of members in a party. Existing members are not removed if the limit is reduced.
		maxPartyMembers = 4
