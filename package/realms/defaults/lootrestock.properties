# LootRestock Configuration
# 
# This file controls how loot chests and barrels respawn in your world.

# ==================== RESET TIMING ====================
# How often should loot containers reset?
# Use either the time value/unit combo OR the cron expression below.
# 
# Reset time value (positive number)
reset_time_value=7
# 
# Reset time unit (seconds, minutes, hours, days)
reset_time_unit=days
# 
# Advanced: Cron expression for scheduled resets (optional)
# If set, this takes precedence over reset_time_value/reset_time_unit
# Examples:
#   "0 0 * * *"     - Daily at midnight
#   "0 0 * * 0"     - Weekly on Sunday at midnight
#   "0 */6 * * *"   - Every 6 hours
#   "0 0 1 * *"     - Monthly on the 1st at midnight
reset_cron=

# ==================== VAULT RESET TIMING ====================
# How often should trial chamber vaults become available to the same player again?
# This uses its own timer and does not affect loot container reset timing.
vault_reset_time_value=7
# 
# Vault reset time unit (seconds, minutes, hours, days)
vault_reset_time_unit=days
# 
# Advanced: Cron expression for scheduled vault resets (optional)
# If set, this takes precedence over vault_reset_time_value/vault_reset_time_unit
vault_reset_cron=

# ==================== RESET BEHAVIOR ====================
# Only reset containers when they are completely empty?
# If true, containers with any items left will not reset
# If false, containers will reset at the scheduled time regardless of contents
only_reset_when_empty=true

# ==================== CONTAINER TYPES ====================
# Should barrels be included in the reset system?
# If true, barrels with loot tables will reset like chests
# If false, only chests will reset
include_barrels=false
# 
# Should item frames be included in the reset system?
# If true, item frames with an item will respawn that item after reset, e.g. Elytras in End Cities
# If false, item frames are ignored
include_item_frames=false
# 
# Should trial chamber vaults become reusable by the same player after the vault reset interval?
# If true, tracked vaults remove individual rewarded-player UUIDs after the vault reset timer
# If false, vaults keep vanilla once-per-player behavior
include_vaults=false

# ==================== PROTECTION ====================
# Who can break loot containers?
# Options:
#   op_only  - Only server operators can break chests (default)
#   anyone   - Anyone can break chests
#   no_one   - No one can break chests (fully protected)
allow_chest_breaking=op_only
# 
# Who can break tracked item frames and their supporting blocks?
# Options:
#   op_only  - Only server operators can break tracked item frames (default)
#   anyone   - Anyone can break tracked item frames
#   no_one   - No one can break tracked item frames (fully protected)
allow_item_frame_breaking=op_only
