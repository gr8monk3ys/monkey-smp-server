#The Realms - first-run defaults, filled in once by the installer.
#After that this file is yours to edit (stop the server first).
motd=\u00a76\u00a7lThe Realms \u00a77- \u00a7fFactions \u00a78| \u00a7cPvP \u00a78| \u00a7dRP
level-name={{LEVEL_NAME}}
level-seed={{SEED}}
online-mode=true
white-list=true
enforce-whitelist=true
pvp=true
difficulty=normal
gamemode=survival
max-players=30
view-distance=8
simulation-distance=6
spawn-protection=48
allow-flight=false
server-port=25565
enable-command-block=false
sync-chunk-writes=false
#Heavy modded world generation can stall a tick for over a minute; don't let the watchdog kill the server.
max-tick-time=-1
enable-rcon=true
rcon.port=25575
rcon.password={{RCON_PASSWORD}}
broadcast-rcon-to-ops=false
