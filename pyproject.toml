[project]
name = "monkey-smp-server-tools"
version = "0.0.0"
description = "Maintainer tools for Monkey SMP Minecraft server package (stdlib only)."
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["SIM115"]  # short scripts read small files with open(); the OS closes them

[tool.ruff.lint.isort]
known-first-party = ["add", "build", "check_updates", "defaults", "entries", "launcher_profile", "loadtest", "patches", "pwsh_lock", "repo", "snapshot", "upstream", "retention", "validate", "wardrobe", "events", "block_wheel", "rules", "map_border", "modrinth", "site_links", "join_addresses", "funnel", "season", "standings", "client_env", "challenges", "drops", "npcs", "lootrestock_patch", "datapacks", "rcon", "nbt", "saved_world", "checks", "local_ci", "season_calendar", "recap", "firsts", "diplomacy", "outposts", "omens", "news", "quest", "goal", "sieges", "lore", "monuments"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]
