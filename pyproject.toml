[project]
name = "monkey-smp-server-tools"
version = "0.0.0"
description = "Maintainer tools for Monkey SMP Minecraft server package (stdlib only)."
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["SIM115"]  # short scripts read small files with open(); the OS closes them

[tool.ruff.lint.isort]
known-first-party = ["add", "build", "check_updates", "defaults", "entries", "loadtest", "patches", "pwsh_lock", "repo", "snapshot", "upstream", "retention", "validate", "wardrobe", "events", "block_wheel", "rules", "map_border", "site_links", "join_addresses", "funnel", "season", "standings", "challenges", "drops", "npcs", "lootrestock_patch", "macelimiter_patch", "datapacks", "rcon", "nbt", "saved_world", "checks", "local_ci", "season_calendar", "season_ics", "recap", "firsts", "diplomacy", "outposts", "omens", "news", "quest", "goal", "sieges", "lore", "monuments", "clips", "camera", "live_packs", "release_gate", "restore_drill", "checksums"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]
# A full run makes ~340k temp files; keeping three runs' worth used up /tmp's inodes (tmpfs) on 2026-11-14.
# Keep only the temp folders of tests that failed, from the last run.
tmp_path_retention_policy = "failed"
tmp_path_retention_count = 1

[dependency-groups]
dev = ["ruff", "pytest"]
