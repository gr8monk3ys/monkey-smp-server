[project]
name = "the-realms-server-tools"
version = "0.0.0"
description = "Maintainer tools for The Realms Minecraft server package (stdlib only)."
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["SIM115"]  # short scripts read small files with open(); the OS closes them

[tool.ruff.lint.isort]
known-first-party = ["build", "check_updates", "defaults", "entries", "patches", "repo", "snapshot", "upstream", "validate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]
